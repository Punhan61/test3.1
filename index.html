<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Таймер интервальной тренировки</title>
  <style>
    :root {
      --bg: #0f1420;
      --card: #1b2333;
      --text: #eef1f7;
      --muted: #9aa3b5;
      --accent: #4f8cff;
      --work: #ff5a5f;
      --rest: #2fd07a;
      --error: #ff6b6b;
      --radius: 16px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(160deg, #0f1420 0%, #1a2236 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: clamp(1.3rem, 4vw, 1.8rem);
      font-weight: 700;
    }

    header p {
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: 6px;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      padding: 28px 24px;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      font-size: 1rem;
      color: var(--text);
      background: #131a29;
      border: 1px solid #2b354d;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--accent);
    }

    input.invalid {
      border-color: var(--error);
    }

    .error {
      display: none;
      color: var(--error);
      font-size: 0.85rem;
      margin-top: 6px;
    }

    .error.visible {
      display: block;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover {
      background: #3f7bef;
    }

    button:active {
      transform: scale(0.98);
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .controls .stop {
      background: transparent;
      border: 1px solid #2b354d;
      color: var(--muted);
    }

    .controls .stop:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
    }

    /* Экран таймера */
    .timer-screen {
      display: none;
      text-align: center;
    }

    .timer-screen.visible {
      display: block;
    }

    .phase {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .phase.work { color: var(--work); }
    .phase.rest { color: var(--rest); }

    .ring {
      width: 200px;
      height: 200px;
      margin: 0 auto 16px;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #131a29;
      border: 6px solid var(--accent);
      transition: border-color 0.3s;
    }

    .ring.work { border-color: var(--work); }
    .ring.rest { border-color: var(--rest); }

    .time {
      font-size: 3rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .round {
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: 8px;
    }

    .total {
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 16px;
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
      margin-top: 24px;
    }

    @media (max-width: 400px) {
      .card {
        padding: 22px 18px;
      }
      .ring {
        width: 170px;
        height: 170px;
      }
      .time {
        font-size: 2.6rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Таймер интервальной тренировки</h1>
    <p>Работа — отдых — раунды. Настрой и жми «Старт»</p>
  </header>

  <main>
    <section class="card">

      <!-- Экран настройки -->
      <form id="setup" novalidate>
        <div class="field">
          <label for="workTime">Время работы, сек</label>
          <input type="number" id="workTime" inputmode="numeric" min="1" placeholder="Например, 45" autocomplete="off">
          <p class="error" id="workTimeError"></p>
        </div>

        <div class="field">
          <label for="restTime">Время отдыха, сек</label>
          <input type="number" id="restTime" inputmode="numeric" min="1" placeholder="Например, 15" autocomplete="off">
          <p class="error" id="restTimeError"></p>
        </div>

        <div class="field">
          <label for="rounds">Количество раундов</label>
          <input type="number" id="rounds" inputmode="numeric" min="1" placeholder="Например, 8" autocomplete="off">
          <p class="error" id="roundsError"></p>
        </div>

        <button type="submit">Старт</button>
      </form>

      <!-- Экран таймера -->
      <div class="timer-screen" id="timerScreen" aria-live="polite">
        <p class="phase" id="phase">Работа</p>

        <div class="ring" id="ring">
          <div class="time" id="time">00:00</div>
          <div class="round" id="round"></div>
        </div>

        <p class="total" id="total"></p>

        <div class="controls">
          <button type="button" id="pauseBtn">Пауза</button>
          <button type="button" class="stop" id="stopBtn">Сброс</button>
        </div>
      </div>

    </section>
  </main>

  <footer>
    Сигналы — через звук браузера. Не закрывай вкладку во время тренировки.
  </footer>

  <script>
    const setupForm = document.getElementById('setup');
    const timerScreen = document.getElementById('timerScreen');

    const workInput = document.getElementById('workTime');
    const restInput = document.getElementById('restTime');
    const roundsInput = document.getElementById('rounds');

    const phaseEl = document.getElementById('phase');
    const timeEl = document.getElementById('time');
    const roundEl = document.getElementById('round');
    const totalEl = document.getElementById('total');
    const ringEl = document.getElementById('ring');
    const pauseBtn = document.getElementById('pauseBtn');
    const stopBtn = document.getElementById('stopBtn');

    let config = null;   // { work, rest, rounds }
    let state = null;    // текущее состояние таймера
    let tickId = null;

    // ---------- Валидация ----------

    function showError(input, errorEl, message) {
      input.classList.add('invalid');
      errorEl.textContent = message;
      errorEl.classList.add('visible');
    }

    function clearError(input, errorEl) {
      input.classList.remove('invalid');
      errorEl.textContent = '';
      errorEl.classList.remove('visible');
    }

    function validate(input, errorEl) {
      const raw = input.value.trim();
      if (raw === '') {
        showError(input, errorEl, 'Заполните это поле');
        return null;
      }
      const num = Number(raw);
      if (Number.isNaN(num)) {
        showError(input, errorEl, 'Введите число');
        return null;
      }
      if (num <= 0) {
        showError(input, errorEl, 'Значение должно быть больше нуля');
        return null;
      }
      if (!Number.isInteger(num)) {
        showError(input, errorEl, 'Введите целое число секунд');
        return null;
      }
      clearError(input, errorEl);
      return num;
    }

    [workInput, restInput, roundsInput].forEach((input, i) => {
      const errorEl = document.getElementById(input.id + 'Error');
      input.addEventListener('input', () => clearError(input, errorEl));
    });

    // ---------- Звук ----------

    let audioCtx = null;

    function beep(frequency = 880, duration = 0.2) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = frequency;
        osc.type = 'sine';
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        // Без звука таймер всё равно работает
      }
    }

    // ---------- Формат времени ----------

    function formatTime(totalSeconds) {
      const m = Math.floor(totalSeconds / 60);
      const s = totalSeconds % 60;
      return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    }

    // ---------- Логика таймера ----------

    setupForm.addEventListener('submit', function (e) {
      e.preventDefault();

      const work = validate(workInput, document.getElementById('workTimeError'));
      const rest = validate(restInput, document.getElementById('restTimeError'));
      const rounds = validate(roundsInput, document.getElementById('roundsError'));

      if (work === null || rest === null || rounds === null) return;

      config = { work, rest, rounds };
      state = {
        phase: 'work',   // 'work' | 'rest'
        secondsLeft: work,
        round: 1,
        paused: false
      };

      setupForm.style.display = 'none';
      timerScreen.classList.add('visible');
      pauseBtn.textContent = 'Пауза';
      render();
      startTicking();
    });

    function render() {
      const isWork = state.phase === 'work';
      phaseEl.textContent = isWork ? 'Работа' : 'Отдых';
      phaseEl.className = 'phase ' + (isWork ? 'work' : 'rest');
      ringEl.className = 'ring ' + (isWork ? 'work' : 'rest');
      timeEl.textContent = formatTime(state.secondsLeft);
      roundEl.textContent = 'Раунд ' + state.round + ' из ' + config.rounds;
      totalEl.textContent = 'Всего раундов: ' + config.rounds +
        ' · вся тренировка: ' + formatTime((config.work + config.rest) * config.rounds);
    }

    function startTicking() {
      clearInterval(tickId);
      tickId = setInterval(() => {
        if (state.paused) return;

        state.secondsLeft--;

        // Сигнал за 3, 2, 1 секунду до конца фазы
        if (state.secondsLeft > 0 && state.secondsLeft <= 3) beep(660, 0.15);

        if (state.secondsLeft <= 0) {
          if (state.phase === 'work') {
            state.phase = 'rest';
            state.secondsLeft = config.rest;
            beep(880, 0.35);
          } else {
            if (state.round >= config.rounds) {
              finish();
              return;
            }
            state.phase = 'work';
            state.round++;
            state.secondsLeft = config.work;
            beep(1100, 0.35);
          }
        }

        render();
      }, 1000);
    }

    function finish() {
      clearInterval(tickId);
      tickId = null;
      phaseEl.textContent = 'Готово!';
      phaseEl.className = 'phase';
      timeEl.textContent = '💪';
      roundEl.textContent = 'Тренировка завершена';
      pauseBtn.textContent = 'Старт';
      beep(1200, 0.4);
      setTimeout(() => beep(1500, 0.5), 350);
    }

    pauseBtn.addEventListener('click', () => {
      if (!state) return;
      if (phaseEl.textContent === 'Готово!') {
        // Кнопка работает как «Старт» после завершения
        setupForm.style.display = '';
        timerScreen.classList.remove('visible');
        state = null;
        return;
      }
      state.paused = !state.paused;
      pauseBtn.textContent = state.paused ? 'Продолжить' : 'Пауза';
    });

    stopBtn.addEventListener('click', () => {
      clearInterval(tickId);
      tickId = null;
      state = null;
      setupForm.style.display = '';
      timerScreen.classList.remove('visible');
      phaseEl.className = 'phase';
    });

    [workInput, restInput, roundsInput].forEach(input => {
      input.addEventListener('input', () => {
        const errorEl = document.getElementById(input.id + 'Error');
        clearError(input, errorEl);
      });
    });
  </script>
</body>
</html>
