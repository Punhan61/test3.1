<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таймер интервальной тренировки</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --work-color: #10b981;
            --rest-color: #f59e0b;
            --danger: #ef4444;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            line-height: 1.5;
        }

        header {
            text-align: center;
            padding: 2rem 1rem 1rem;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .card {
            background: var(--card-bg);
            width: 100%;
            max-width: 420px;
            border-radius: 20px;
            padding: 2rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        /* Настройки */
        .settings-grid {
            display: grid;
            gap: 1.25rem;
            margin-bottom: 1.5rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .input-group label {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .input-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            font-size: 1rem;
            color: var(--text-main);
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .error-message {
            color: var(--danger);
            font-size: 0.875rem;
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            padding: 0.75rem;
            border-radius: 10px;
            margin-bottom: 1.25rem;
            display: none;
        }

        /* Экран активного таймера */
        .timer-display {
            display: none;
            text-align: center;
            padding: 1rem 0 1.5rem;
        }

        .phase-badge {
            display: inline-block;
            padding: 0.35rem 1rem;
            border-radius: 999px;
            font-size: 0.875rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
        }

        .phase-work {
            background-color: #d1fae5;
            color: #065f46;
        }

        .phase-rest {
            background-color: #fef3c7;
            color: #92400e;
        }

        .phase-done {
            background-color: #dbeafe;
            color: #1e40af;
        }

        .time-value {
            font-size: 4.5rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            margin: 0.5rem 0;
            letter-spacing: -0.03em;
        }

        .round-info {
            font-size: 1rem;
            color: var(--text


);
            font-weight: 500;
            margin-top: 0.75rem;
        }

        /* Кнопки */
        .controls {
            display: flex;
            gap: 0.75rem;
        }

        button {
            flex: 1;
            padding: 0.875rem 1.25rem;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background-color: var(--primary);
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: #f1f5f9;
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background-color: #e2e8f0;
        }

        footer {
            text-align: center;
            padding: 1.5rem 1rem;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        max-width: 480px {
            .card {
                padding: 1.5rem;
                border-radius: 16px;
            }
            .time-value {
                font-size: 3.75rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Таймер интервальной тренировки</h1>
    </header>

    <main>
        <section class="card" aria-label="Управление тренировкой">
            <!-- Блок ошибок -->
            <div id="errorBox" class="error-message" role="alert"></div>

            <!-- Форма настроек -->
            <form id="settingsForm" novalidate>
                <div class="settings-grid">
                    <div class="input-group">
                        <label for="workInput">Время работы (секунды)</label>
                        <input type="number" id="workInput" value="30" min="1" step="1" required>
                    </div>
                    <div class="input-group">
                        <label for="restInput">Время отдыха (секунды)</label>
                        <input type="number" id="restInput" value="15" min="0" step="1" required>
                    </div>
                    <div class="input-group">
                        <label for="roundsInput">Количество раундов</label>
                        <input type="number" id="roundsInput" value="5" min="1" step="1" required>
                    </div>
                </div>
                <div class="controls">
                    <button type="submit" class="btn-primary">Начать тренировку</button>
                </div>
            </form>

            <!-- Экран таймера -->
            <div id="timerScreen" class="timer-display">
                <div id="phaseBadge" class="phase-badge phase-work">Работа</div>
                <div id="timeDisplay" class="time-value">00:30</div>
                <div id="roundDisplay" class="round-info">Раунд 1 из 5</div>
                
                <div class="controls" style="margin-top: 2rem;">
                    <button type="button" id="pauseBtn" class="btn-primary">Пауза</button>
                    <button type="button" id="resetBtn" class="btn-secondary">Сброс</button>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>Интервальный таймер &copy; 2026</p>
    </footer>

    <script>
        (function () {
            // Элементы DOM
            const settingsForm = document.getElementById('settingsForm');
            const timerScreen = document.getElementById('timerScreen');
            const errorBox = document.getElementById('errorBox');

            const workInput = document.getElementById('workInput');
            const restInput = document.getElementById('restInput');
            const roundsInput = document.getElementById('roundsInput');

            const phaseBadge = document.getElementById('phaseBadge');
            const timeDisplay = document.getElementById('timeDisplay');
            const roundDisplay = documen


t.getElementById('roundDisplay');

            const pauseBtn = document.getElementById('pauseBtn');
            const resetBtn = document.getElementById('resetBtn');

            // Состояние таймера
            let config = { work: 30, rest: 15, rounds: 5 };
            let currentRound = 1;
            let currentPhase = 'work'; // 'work' | 'rest' | 'done'
            let timeLeft = 0;
            let timerId = null;
            let isPaused = false;

            // Встроенный звуковой сигнал (Web Audio API, без внешних файлов)
            function playBeep(freq = 600, duration = 0.15) {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, ctx.currentTime);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + duration);
                } catch (e) {
                    // Игнорируем ошибку, если браузер заблокировал аудио
                }
            }

            // Валидация полей
            function validateInputs() {
                const workRaw = workInput.value.trim();
                const restRaw = restInput.value.trim();
                const roundsRaw = roundsInput.value.trim();

                if (workRaw === '' || restRaw === '' || roundsRaw === '') {
                    return 'Пожалуйста, заполните все поля перед запуском.';
                }

                const work = Number(workRaw);
                const rest = Number(restRaw);
                const rounds = Number(roundsRaw);

                if (isNaN(work) || isNaN(rest) || isNaN(rounds)) {
                    return 'Вводите только корректные числовые значения.';
                }

                if (!Number.isInteger(work) || !Number.isInteger(rest) || !Number.isInteger(rounds)) {
                    return 'Используйте только целые числа.';
                }

                if (work <= 0) {
                    return 'Время работы должно быть больше 0 секунд.';
                }

                if (rest < 0) {
                    return 'Время отдыха не может быть отрицательным.';
                }

                if (rounds <= 0) {
                    return 'Количество раундов должно быть не меньше 1.';
                }

                config = { work, rest, rounds };
                return null;
            }

            function showError(message) {
                errorBox.textContent = message;
                errorBox.style.display = 'block';
            }

            function hideError() {
                errorBox.style.display = 'none';
                errorBox.textContent = '';
            }

            function formatTime(seconds) {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            }

            function updateUI() {
                timeDisplay.textContent = formatTime(timeLeft);

                if (currentPhase === 'work') {
                    phaseBadge.textContent = 'Работа';
                    phaseBadge.className = 'phase-badge phase-work';
                    roundDisplay.textContent = `Раунд ${currentRound} из ${config.rounds}`;
                } else if (currentPhase === 'rest') {
                    phaseBadge.textContent = 'Отдых';
                    phaseBadge.className = 'phase-badge phase-rest';
                    roundDisplay.textContent = `Раунд ${currentRound} из ${config.rounds}`;
                } else {
                    phaseBadge.textContent = 'Финиш';
                    phaseBadge.className = 'phase-badge ph


ase-done';
                    roundDisplay.textContent = 'Тренировка завершена!';
                }
            }

            function finishWorkout() {
                clearInterval(timerId);
                timerId = null;
                currentPhase = 'done';
                timeLeft = 0;
                pauseBtn.style.display = 'none';
                updateUI();
                playBeep(880, 0.4);
            }

            function tick() {
                if (isPaused) return;

                if (timeLeft > 1) {
                    timeLeft--;
                    if (timeLeft <= 3) playBeep(440, 0.08);
                    updateUI();
                } else {
                    // Переключение фаз
                    if (currentPhase === 'work') {
                        if (currentRound >= config.rounds) {
                            finishWorkout();
                            return;
                        }
                        if (config.rest > 0) {
                            currentPhase = 'rest';
                            timeLeft = config.rest;
                            playBeep(520, 0.2);
                        } else {
                            currentRound++;
                            timeLeft = config.work;
                            playBeep(700, 0.2);
                        }
                    } else if (currentPhase === 'rest') {
                        currentRound++;
                        currentPhase = 'work';
                        timeLeft = config.work;
                        playBeep(700, 0.2);
                    }
                    updateUI();
                }
            }

            // Запуск тренировки
            settingsForm.addEventListener('submit', function (e) {
                e.preventDefault();
                const error = validateInputs();
                if (error) {
                    showError(error);
                    return;
                }

                hideError();
                currentRound = 1;
                currentPhase = 'work';
                timeLeft = config.work;
                isPaused = false;

                pauseBtn.style.display = 'inline-block';
                pauseBtn.textContent = 'Пауза';
                settingsForm.style.display = 'none';
                timerScreen.style.display = 'block';

                updateUI();
                playBeep(700, 0.2);

                clearInterval(timerId);
                timerId = setInterval(tick, 1000);
            });

            // Пауза / Продолжить
            pauseBtn.addEventListener('click', function () {
                isPaused = !isPaused;
                pauseBtn.textContent = isPaused ? 'Продолжить' : 'Пауза';
            });

            // Сброс к настройкам
            resetBtn.addEventListener('click', function () {
                clearInterval(timerId);
                timerId = null;
                isPaused = false;
                timerScreen.style.display = 'none';
                settingsForm.style.display = 'block';
                hideError();
            });
        })();
    </script>
</body>
</html>-muted
